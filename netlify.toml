[dev]
  port=8080

[build]
  functions = "functions/"
  publish = "build/"
  command = "npm run build"

# /token/* does not match /token; 200 rewrite preserves query string for the function.
[[redirects]]
  from = "/token"
  to = "/.netlify/functions/get-token"
  status = 200
  force = true

[[redirects]]
  from = "/token/*"
  to = "/.netlify/functions/get-token"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
